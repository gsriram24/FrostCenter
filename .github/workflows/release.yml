name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev

      - name: Verify Python syntax
        run: |
          python3 -m py_compile OFC.py ec_access.py model_config.py version.py ui/*.py tests/simulate_frostcenter.py

      - name: Build release packages (.deb, .rpm, .tar.gz)
        run: |
          chmod +x packaging/build_packages.sh
          ./packaging/build_packages.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
